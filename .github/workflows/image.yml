# Builds the server image and pushes it to GHCR, via coldstart's reusable
# workflow — the build and push steps live there, not here.
#
# The image embeds the game, which is NOT redistributable. `ghcr.io/hcbt/nixzoid`
# must stay a PRIVATE package even though this repository is public. Making it
# public would be republishing Project Zomboid.
#
# Runs on a GitHub-hosted runner with `free-disk-space`, not on the self-hosted
# nix-x64 one. The image is ~7G on top of ~7G of Steam depots, and the
# self-hosted runner's Nix store is a 15Gi emptyDir shared with every other
# repository's builds — this would evict all of them and then run out anyway. A
# hosted runner has ~14G free by default and ~45G once the preinstalled
# toolchains are removed, which is what `free-disk-space` does.
name: image

on:
  push:
    branches: [master]
    paths:
      - pkgs/**
      - nix/**
      - flake.nix
      - flake.lock
      - .github/workflows/image.yml
  # Lets the first image be built by clicking Run workflow.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: hcbt/coldstart/.github/workflows/build-push-image.yml@v0.3.2
    with:
      package: zomboid-image
      image: ghcr.io/hcbt/nixzoid
      free-disk-space: true
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
